name: Ty

on:
  push:
  pull_request:

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Full sync: ty resolves the project's own imports.
      - name: Sync project
        run: uv sync --locked
      - name: Type check
        run: uv run --locked ty check
