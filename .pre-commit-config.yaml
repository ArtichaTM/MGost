repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: isort
        name: isort
        entry: uv run --locked isort
        language: system
        types: [python]
        require_serial: true
